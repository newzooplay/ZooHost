
name: Convert MP4 to HLS

on:
  workflow_dispatch:
  push:
    paths:
      - "zooplay.mp4"
      - ".github/workflows/convert.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert MP4 to HLS
        run: |
          test -f zooplay.mp4
          mkdir -p hls

          ffmpeg -y \
            -i zooplay.mp4 \
            -map 0:v:0 \
            -map "0:a:0?" \
            -c:v libx264 \
            -preset veryfast \
            -c:a aac \
            -b:a 128k \
            -hls_time 6 \
            -hls_playlist_type vod \
            -hls_segment_filename "hls/segment_%03d.ts" \
            -f hls hls/index.m3u8

      - name: Commit generated HLS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hls/

          if ! git diff --cached --quiet; then
            git commit -m "Generate HLS playlist"
            git push
          fi
