
name: ZooPLAY HLS Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "zooplay.mp4"
      - ".github/workflows/convert-hls.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zooplay-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Video
        run: |
          if [ ! -f zooplay.mp4 ]; then
            echo "ERROR: zooplay.mp4 not found in repository root"
            exit 1
          fi

          ls -lh zooplay.mp4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert MP4 to HLS
        run: |
          mkdir -p public

          ffmpeg -y \
            -i zooplay.mp4 \
            -map 0:v:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -an \
            -force_key_frames "expr:gte(t,n_forced*4)" \
            -f hls \
            -hls_time 4 \
            -hls_playlist_type vod \
            -hls_segment_filename "public/segment_%03d.ts" \
            public/index.m3u8

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>ZooPLAY</title>
            <style>
              body {
                margin: 0;
                background: #10131b;
                color: white;
                font: 16px Arial, sans-serif;
                display: grid;
                place-items: center;
                min-height: 100vh;
              }
              main {
                width: min(900px, 94%);
                text-align: center;
              }
              video {
                width: 100%;
                background: #000;
                border-radius: 12px;
              }
              a { color: #8bb8ff; }
            </style>
          </head>
          <body>
            <main>
              <h1>ZooPLAY</h1>
              <video controls autoplay muted loop playsinline>
                <source src="index.m3u8" type="application/vnd.apple.mpegurl">
                Your browser may require an HLS-compatible player.
              </video>
              <p><a href="index.m3u8">Open HLS Playlist</a></p>
            </main>
          </body>
          </html>
          EOF

          echo "HLS files generated:"
          ls -lh public/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
